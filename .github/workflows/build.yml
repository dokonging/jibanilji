name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Firebase 설정 파일: app/google-services.json 을 올렸거나,
      # 저장소 Settings > Secrets 에 GOOGLE_SERVICES_JSON 으로 넣어두면 됨
      - name: Prepare Firebase config
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then echo "$GS" > app/google-services.json; fi
          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json 이 없어요. README의 Firebase 설정을 확인해 주세요."
            exit 1
          fi

      - name: Build APK
        run: |
          set -o pipefail
          if ! gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log; then
            # 오류 줄만 모아서 Actions 화면 요약에 표시
            msg=$(grep -E "^e: |^w: .*error|What went wrong|^> |error:|Exception|not found|Could not" build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::${msg}"
            exit 1
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk 집안일지.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 집안일지 (빌드 ${{ github.run_number }})
          files: 집안일지.apk
