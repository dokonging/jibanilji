name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Firebase 설정 파일: app/google-services.json 을 올렸거나,
      # 저장소 Settings > Secrets 에 GOOGLE_SERVICES_JSON 으로 넣어두면 됨
      - name: Prepare Firebase config
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then echo "$GS" > app/google-services.json; fi
          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json 이 없어요. README의 Firebase 설정을 확인해 주세요."
            exit 1
          fi

      - name: Build APK
        run: |
          set +e
          gradle assembleRelease --no-daemon --console=plain > build.log 2>&1
          code=$?
          tail -n 80 build.log
          if [ $code -ne 0 ]; then
            # 실패하면 전체 로그를 build-log 브랜치에 저장 (원인 확인용)
            git config user.name "build-bot"
            git config user.email "build-bot@users.noreply.github.com"
            cp build.log /tmp/build.log
            git checkout -q --orphan build-log
            git rm -rq --cached . > /dev/null
            cp /tmp/build.log build.log
            git add -f build.log
            git commit -qm "build log ${{ github.run_number }}"
            git push -qf origin build-log
            exit 1
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk 집안일지.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 집안일지 (빌드 ${{ github.run_number }})
          files: 집안일지.apk
